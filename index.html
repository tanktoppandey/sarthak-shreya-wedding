<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sarthak &amp; Shreya - Invitation Previews</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(ellipse at center, #7a1426 0%, #3a040b 100%); font-family: 'Montserrat', sans-serif; color: #fbe9d0; text-align: center; }
  h1 { font-family: 'Dancing Script', cursive; font-size: clamp(2.4rem, 9vw, 3.4rem); color: #f3d79a; }
  p.sub { font-size: .8rem; letter-spacing: .25em; text-transform: uppercase; color: #e6c887; margin: 6px 0 28px; }
  .cards { display: grid; gap: 16px; width: min(440px, 100%); margin: 0 auto; }
  a.card { display: block; padding: 22px 20px; border-radius: 18px; text-decoration: none; background: #fdf4ec; color: #5c0812;
    border: 1px solid #c5a059; box-shadow: 0 14px 30px rgba(0,0,0,.35); transition: transform .2s; }
  a.card:hover { transform: translateY(-3px); }
  a.card b { display: block; font-family: 'Dancing Script', cursive; font-size: 2rem; }
  a.card span { font-size: .78rem; color: #7d5a55; }
</style>
</head>
<body>
  <main>
    <h1>Sarthak &amp; Shreya</h1>
    <p class="sub">Invitation previews</p>
    <div class="cards">
      <a class="card" href="sarthak/"><b>Sarthak's family</b><span>Crimson theme &middot; Chakrawarti family</span></a>
      <a class="card" href="shreya/"><b>Shreya's family</b><span>Blood crimson theme &middot; Singh Family</span></a>
    </div>
  </main>
</body>
</html>
